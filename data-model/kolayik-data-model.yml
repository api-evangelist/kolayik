    gender: [female, male, unspecified]
    maritalStatus: [married, single, divorced, unspecified]
    educationLevel: [primary, secondary, high_school, associate, bachelor, master,
      doctorate, none]
    educationStatus: [graduate, student]
    levelOfDisability: [notDisabled, thirdLevel, secondLevel, firstLevel]
    bloodType: [A-, A+, 0+, 0-, AB-, AB+, B-, B+]
- name: PersonDataField
  description: A custom person attribute, addressed by fieldToken and carried on Person.dataList.
    Available tokens are discoverable at runtime.
  operations: [personShowAvailableDataFields]
  key_fields: [fieldToken, value]
- name: Compensation
  description: A salary/compensation record on a Person, with nested benefit items
    (food, transportation, ...).
  key_fields: [amount, payPeriod, gross, currency, effectiveOn, active, items]
- name: Unit
  description: A node of the organizational tree (Şirket / Şube / Departman / Unvan).
    A Person's unitList assigns them to unit items over time.
  operations: [unitShowUnitTree, unitCreateUnitItem]
  key_fields: [unitId, unitName, unitItemName]
- name: Leave
  description: A leave/absence request for a Person, of a given LeaveType, over a date
    range, optionally with a replacement Person.
  operations: [leaveList, leaveCreate, leaveView]
  key_fields: [leaveId, personId, leaveTypeId, startDate, endDate, status, comment,
    replacementPersonId]
  enumerations:
    status: [approved, waiting]
- name: LeaveType
  description: A category of leave, referenced by leaveTypeId when creating a leave
    record.
  key_fields: [leaveTypeId]
- name: Timelog
  description: A time entry (work or overtime) for a Person over a start/end datetime.
  operations: [timelogCreate, timelogList, timelogView, timelogDelete]
  key_fields: [id, personId, startDate, endDate, status, type, description]
  enumerations:
    type: [work, overtime]
    status: [approved, waiting]
- name: Transaction
  description: An expense or advance transaction attached to a Person.
  operations: [transactionCreate, transactionList, transactionView, transactionDelete]
  key_fields: [id, personId, type, status, paid, expenseCenterId]
  enumerations:
    type: [advance-expense]
    status: [approved]
- name: ExpenseCategory
  description: A category available for expense transactions.
  operations: [expenseListCategories]
  key_fields: [title, isEnable]
- name: Training
  description: A catalogue training course, assignable to People.
  operations: [trainingCreate, trainingList, trainingView, trainingUpdate, trainingDelete]
  key_fields: [id, title]
- name: PersonTraining
  description: The assignment of a Training to a Person.
  operations: [personAssignTraining, personListTrainings, personUpdateTraining, personDeleteTraining]
  key_fields: [personTrainingId, personId]
- name: Event
  description: A calendar event.
  operations: [eventCreate, eventList, eventView, eventUpdate, eventDelete]
  key_fields: [id, start, end, search]
- name: PersonFile
  description: A file (and containing folder) stored on a Person's özlük record.
  operations: [personUploadFile, personListFiles, personDeleteFile, personDeleteFolder]
  key_fields: [fileId, folderId, personId]
- name: Payroll
  description: A payroll run; a payroll sheet is retrieved per payrollId.
