entities:
- name: Person
  description: An employee record. Every human in Kolay — including admins and non-login
    employees — is a Person. The central entity of the model.
  operations: [personCreate, personUpdate, personView, personViewSummary, personBulkView,
    personList, personTerminate, personRehire, personShowAvailableDataFields, personLeaveStatus]
  key_fields: [id, firstName, lastName, email, workEmail, employmentStartDate, contractType,
    contractEndDate, accessType, idNumber, nationality]
