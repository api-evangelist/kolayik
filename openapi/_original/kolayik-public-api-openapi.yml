  /v2/person/terminate:
    post:
      operationId: personTerminate
      summary: Terminate employment
      description: '* personId: id value of the person who will be terminated.

        * date: date of termination. This attribute can be set to a future date.

        * reasonCode: code of termination reason. Can take values between "01" and "50". Each code is
        connected to a specific reason text.

        * details: comments and details about the termination. (Optional)

        * replacementId: terminated person''s ongoing approval processes and managees will be switched
        to this person. (Optional)'
      tags:
      - Person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              personId: d4038631aa494e4450aa3b8a88796bef
              date: '2023-01-23'
              reasonCode: '01'
              details: Details about the termination
              replacementId: d5a6fa7d90f3c29b9a7abce8302c19b9
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                error: false
                data:
                  id: 1302952557a17a75371b183aad2b4987
                  firstName: Anna
                  lastName: Lisa
  /v2/person/upload-file:
    post:
      operationId: personUploadFile
      summary: Upload file
      description: You can use this endpoint to upload a single file to a person's personal folder. You
        can specify a folder name or skip it to upload the file to the root folder. Executable or potentially
        harmful file extensions will not be accepted. You can use PDF, Excel, Word or similar file formats.
        Returned file size is in bytes.
      tags:
      - Person
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                personId:
                  type: string
                folderName:
                  type: string
                file:
