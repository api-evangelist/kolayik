openapi: 3.1.0
info:
  title: Kolay Public API
  version: 2.0.0
  description: 'Welcome to Public API reference of Kolay!


    This documentation is here to help you easily integrate your existing apps to Kolay. In order to use
    this API you need to have an API Token ready. If you don''t have an existing API Token you can visit
    the following link and create one for your needs https://app.kolayik.com/settings/developer-settings
    If you have any technical questions you can contact us via apisupport@kolay.io'
  contact:
    name: Kolay API Support
    email: apisupport@kolay.io
    url: https://apidocs.kolayik.com/
servers:
- url: https://api.kolayik.com
  description: Production
tags:
- name: Person
- name: Unit
- name: Leave
- name: Profile
- name: Timelog
- name: Transaction
- name: Approval Process
- name: Calendar
- name: Training
- name: Expense
- name: Payroll
security:
- bearerAuth: []
paths:
  /v2/person/create:
    post:
      operationId: personCreate
      summary: Create a person
      description: "You can create a single person with all the basic information populated. Only the\
        \ firstName and the lastName fields are mandatory, others are optional. All skipped fields default\
        \ to null unless otherwise stated.\n\nperson\nPerson Object Model\n\nperson.dataList\nThis is\
        \ a list of additional person data fields. This object attribute only accepts an array of objects.\
        \ Objects can only have two properties named fieldToken and value.\n\n[\n    {\n        \"fieldToken\"\
        : \"adres\",\n        \"value\": \"Selam Sok. 33/4\"\n    },\n    {\n        \"fieldToken\": \"\
        evTelefonu\",\n        \"value\": \"02123456666\"\n    }\n]\n\nperson.unitList\nThis field is\
        \ the unit list of a person and accepts an array of unit objects, so you can choose to add historical\
        \ data or only the active unit. If the field default is true that means it will be the default\
        \ unit throughout the system.\n\nemploymentType fulltime parttime intern freelance daily contracted\
        \ mobile\n\n[\n    {\n        \"startDate\": \"2020-08-13\",\n        \"endDate\": \"2020-08-14\"\
        ,\n        \"employmentType\": \"fulltime\",\n        \"managerId\": null,\n        \"default\"\
        : true,\n        \"active\": true,\n        \"items\": [\n            {\n                \"unitName\"\
        : \"Şirket\",\n                \"unitItemName\": \"Smith Group\"\n            },\n           \
        \ {\n                \"unitName\": \"Şube\",\n                \"unitItemName\": \"Amsterdam\"\n\
        \            },\n            {\n                \"unitName\": \"Departman\",\n               \
        \ \"unitItemName\": \"Sales\"\n            },\n            {\n                \"unitName\": \"\
        Unvan\",\n                \"unitItemName\": \"Enterprise Sales Asisstant\"\n            }\n  \
        \      ]\n    }\n]\n\nperson.compensationList\nYou can use this field to provide compensation\
        \ and salary information for the person. It only accepts an array of objects. So you can use this\
        \ field to add all historical compensation data, it this case only the 'active: true' one will\
        \ be the current.\n\npayPeriod monthly daily yearly weekly hourly\ntype bonus food transportation\
        \ healthInsurance personalRetirement\n\n[\n            {\n                \"amount\": 1250.50,\n\
        \                \"payPeriod\": \"monthly\",\n                \"gross\": true,\n             \
        \   \"currency\": \"TL\",\n                \"comment\": \"Starting salary\",\n               \
        \ \"active\": true,\n                \"effectiveOn\": \"2020-08-13\",\n                \"items\"\
        : [\n                    {\n                        \"amount\": 250,\n                       \
        \ \"type\": \"food\",\n                        \"currency\": \"TL\",\n                       \
        \ \"affectPayroll\": true,\n                        \"gross\": true,\n                       \
        \ \"comment\": \"Cash for food\",\n                        \"payPeriod\": \"monthly\"\n      \
        \              },\n                    {\n                        \"amount\": 50,\n          \
        \              \"type\": \"transportation\",\n                        \"currency\": \"TL\",\n\
        \                        \"affectPayroll\": true,\n                        \"gross\": true,\n\
        \                        \"comment\": \"Top-up cost for public transportation\",\n           \
        \             \"payPeriod\": \"monthly\"\n                    }\n                ]\n         \
        \   }\n        ]\n\noptions\n\nsendWelcomeEmail can be true or false, if true an e-mail will be\
        \ sent welcoming the person with a link to login. (default: false)"
      tags:
      - Person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              person:
                firstName: Lorem
                lastName: Ipsum
                email: loremipsum0@gmail.com
                workEmail: lorem.ipsum0@kolayhr.com
                workPhone: '+902120000000'
                workPhoneCountryCode: TR
                mobilePhone: '+905550000000'
                mobilePhoneCountryCode: TR
                employmentStartDate: '2020-08-13'
                contractType: definite
                contractEndDate: '2021-08-13'
                birthday: '1993-06-16'
                idNumber: '2871376222213131'
                maritalStatus: married
                gender: female
                levelOfDisability: firstLevel
                educationLevel: associate
                educationStatus: graduate
                educationalInstitution: Istanbul Technical University
                nationality: TR
                numberOfChildren: 1
                militaryService: null
                militaryServiceDelayDate: null
                accessType: employee
                partnerWorkStatus: working
                bloodType: A-
                dataList:
                - fieldToken: adres
                  value: Selam Sok. 33/4
                - fieldToken: evTelefonu
                  value: '02123456666'
                compensationList:
                - amount: 1250.5
                  payPeriod: monthly
                  gross: true
                  currency: TL
                  comment: Starting salary
                  active: true
                  effectiveOn: '2020-08-13'
                  items:
                  - amount: 250
                    type: food
                    currency: TL
                    affectPayroll: true
                    gross: true
                    comment: Cash for food
                    payPeriod: monthly
                  - amount: 50
                    type: transportation
                    currency: TL
                    affectPayroll: true
                    gross: true
                    comment: Top-up cost for public transportation
                    payPeriod: monthly
                unitList:
                - startDate: '2020-08-13'
                  endDate: '2020-08-14'
                  employmentType: fulltime
                  managerId: null
                  default: true
                  items:
                  - unitName: Şirket
                    unitItemName: Smith Group
                  - unitName: Şube
                    unitItemName: Lake Isomberg
                  - unitName: Departman
                    unitItemName: champlin
                  - unitName: Unvan
                    unitItemName: Construction Laborer
              options:
                sendWelcomeEmail: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                error: false
                data:
                  person:
                    id: 4fbbe363dbb6587af080ab90d4fec8e3
                    firstName: Lorem
                    lastName: Ipsum
                  options: []
  /v2/person/update:
    put:
      operationId: personUpdate
      summary: Update a person
      description: "You can update the details of a single person. Only the id is mandatory, other fields\
        \ will be updated if provided. In order to remove a value from the object, you should send it\
        \ as null.\n\nperson\nPerson Object Model\n\nperson.dataList\nThis is a list of additional person\
        \ data fields. This object attribute only accepts an array of objects. Objects can only have two\
        \ properties named fieldToken and value.\n\n[\n    {\n        \"fieldToken\": \"adres\",\n   \
        \     \"value\": \"Selam Sok. 33/4\"\n    },\n    {\n        \"fieldToken\": \"evTelefonu\",\n\
        \        \"value\": \"02123456666\"\n    }\n]\n\nperson.unitList\nThis field is the unit list\
        \ of a person and accepts an array of unit objects, so you can choose to add historical data or\
        \ only the active unit. If the field default is true that means it will be the default unit throughout\
        \ the system. Items will be removed if not included that has already been sent while creating.\
        \ So the given array will be the final list of units.\n\n[\n    {\n        \"startDate\": \"2020-08-13\"\
        ,\n        \"endDate\": \"2020-08-14\",\n        \"employmentType\": \"fulltime\",\n        \"\
        managerId\": null,\n        \"default\": true,\n        \"active\": true,\n        \"items\":\
        \ [\n            {\n                \"unitName\": \"Şirket\",\n                \"unitItemName\"\
        : \"Smith Group\"\n            },\n            {\n                \"unitName\": \"Şube\",\n  \
        \              \"unitItemName\": \"Amsterdam\"\n            },\n            {\n              \
        \  \"unitName\": \"Departman\",\n                \"unitItemName\": \"Sales\"\n            },\n\
        \            {\n                \"unitName\": \"Unvan\",\n                \"unitItemName\": \"\
        Enterprise Sales Asisstant\"\n            }\n        ]\n    }\n]"
      tags:
      - Person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              person:
                id: 57a53d44282598ff0298103381df8190
                dataList:
                - fieldToken: sonIseBaslamaTarihi
                  value: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                error: false
                data:
                  person:
                    id: 06ccf23835a39d79d3caaf9ea9ec4497
                    firstName: Lorem
                    lastName: Ipsum
